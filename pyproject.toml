[project]
name = "agent-hq"
version = "0.1.0"
description = "Local-first mission control where a team of AI agents finds, vets and applies to AI/ML roles for Prerit."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "httpx>=0.27",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "croniter>=3.0",
    "jsonschema>=4.23",
    "watchfiles>=0.24",
    "rapidfuzz>=3.9",
    "selectolax>=0.3",
    "itsdangerous>=2.2",
    "python-dateutil>=2.9",
    "fpdf2>=2.8",
    "pypdf>=5.0",
    "mlx-lm>=0.31.3",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "playwright>=1.47",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: real local model or claude calls"]

[tool.uv]
package = false
